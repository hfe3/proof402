name: Production Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: read

jobs:
  production-monitor:
    name: Production monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production without payment
        run: npm run monitor:production
