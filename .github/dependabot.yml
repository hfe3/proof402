version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      node-runtime:
        patterns:
          - "express"
          - "dotenv"
          - "pg"
      x402:
        patterns:
          - "@coinbase/x402"
          - "@x402/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
